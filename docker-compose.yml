# Everything the backend needs, locally: `docker compose up -d` starts the database and the API.
# `docker compose down -v` throws both away; the next `up` makes the tables again (the API migrates when it starts).
services:
  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: stocks
      POSTGRES_PASSWORD: stocks
      POSTGRES_DB: stocks
    volumes:
      - stocks-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocks"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    ports:
      - "4000:4000"
    # What the web app is set up with is what the API needs too, above all the same AUTH_SECRET: both read the sign-in cookie. What is set
    # under `environment` wins over the file.
    env_file:
      - path: ./apps/web/.env.local
        required: false
    environment:
      DATABASE_URL: postgresql://stocks:stocks@db:5432/stocks
      # The key the web app's server sends. For working locally only: set a long random one anywhere else.
      STOCKS_API_KEY: local-development-key
      # Where the browser connects for chat, handed out with each chat pass
      REALTIME_WS_URL: ${REALTIME_WS_URL:-ws://localhost:3002}
      # For trying the MCP server without the AI credit Sandworm's own research needs: `scripts/mcp-test.sh` sets these in the `.env` beside this
      # file. With RESEARCH_PRODUCER=agent the research waits for an agent (Claude) to do it and hand it back. Left empty, they are not set.
      RESEARCH_PRODUCER: ${RESEARCH_PRODUCER:-}
      STOCKS_AGENT_TOKEN: ${STOCKS_AGENT_TOKEN:-}
      STOCKS_AGENT_OWNER_ID: ${STOCKS_AGENT_OWNER_ID:-}
    # Some home routers' resolvers fail on api.coinbase.com, the list of stocks on Base; public ones are asked instead. Remove this on a network
    # that only lets its own resolver through.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  stocks-db:
